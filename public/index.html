<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Камень · Ножницы · Бумага</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="page">
    <header class="masthead">
      <h1>
        <span class="w-red">Камень</span>
        <span class="w-blue">Ножницы</span>
        <span class="w-yellow">Бумага</span>
      </h1>
      <div class="masthead-marks"><i></i><i></i><i></i></div>
    </header>

    <section class="block">
      <button class="btn btn-primary" id="create" type="button">Создать комнату</button>
      <div class="error hidden" id="error"></div>
      <p class="hint" style="margin-top:18px">
        Тот, кто создал комнату, ведёт игру: объявляет пары и запускает раунды.
        Остальным нужно просто отправить ссылку на комнату.
      </p>
    </section>
  </div>

  <script src="/landing.js"></script>
</body>
</html>
